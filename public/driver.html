<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5a300">
  <title>Şoför</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 12px; }
    .actions { display: grid; gap: 10px; margin: 12px 0; }
    .actions button { padding: 18px; font-size: 1.1rem; }
    .stops { list-style: none; padding: 0; margin: 0; }
    .stops li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .stops li.done { color: var(--muted); text-decoration: line-through; }
    .stops li:last-child { border-bottom: 0; }
    .gps { margin: 8px 0; }
  </style>
</head>
<body>
  <h2 id="title">Şoför ekranı</h2>
  <div class="card gps small" id="gps"><span class="dot"></span> GPS kapalı</div>

  <div class="actions" id="startBtns">
    <button class="primary" data-type="morning">🌅 Sabah turunu başlat (evlerden okula)</button>
    <button class="primary" data-type="afternoon">🌇 Akşam turunu başlat (okuldan evlere)</button>
  </div>
  <div class="actions" id="endBtns" hidden>
    <button class="danger" id="endBtn">⏹ Turu bitir</button>
  </div>

  <div class="card">
    <h3>Duraklar</h3>
    <ul class="stops" id="stops"><li class="muted">Tur başlamadı.</li></ul>
  </div>
  <p class="muted small">Tur boyunca bu sayfayı açık tutun. Konumunuz yalnızca tur sırasında velilerle paylaşılır.</p>

  <script src="/static/common.js"></script>
  <script>
    const token = location.pathname.split('/').pop();
    let watchId = null, wakeLock = null, lastSent = 0;

    function render(v) {
      $('title').textContent = `${v.bus.name}${v.bus.plate ? ' · ' + v.bus.plate : ''}`;
      const active = v.trip && !v.trip.finishedAt;
      $('startBtns').hidden = active;
      $('endBtns').hidden = !active;
      if (!v.trip) return;
      $('stops').innerHTML = v.trip.stops.map((s) => `
        <li class="${s.done ? 'done' : ''}">
          <span>${s.kind === 'school' ? '🏫' : '🏠'} ${escapeHtml(s.name)}</span>
          <span>${s.done ? '✓ ' + fmtTime(s.doneAt) : fmtMin(s.etaSec) + ' dk'}</span>
        </li>`).join('');
      if (active) startGps(); else stopGps();
    }

    function startGps() {
      if (watchId != null) return;
      if (!navigator.geolocation) { $('gps').textContent = 'Bu cihaz konum desteklemiyor'; return; }
      watchId = navigator.geolocation.watchPosition(async (p) => {
        $('gps').innerHTML = `<span class="dot ok"></span> GPS açık (±${Math.round(p.coords.accuracy)} m)`;
        if (Date.now() - lastSent < 4000) return;
        lastSent = Date.now();
        try {
          render(await api('POST', `/api/driver/${token}/location`, {
            lat: p.coords.latitude, lng: p.coords.longitude, speed: p.coords.speed, accuracy: p.coords.accuracy,
          }));
        } catch (e) { $('gps').innerHTML = `<span class="dot warn"></span> Gönderilemedi: ${escapeHtml(e.message)}`; }
      }, (err) => { $('gps').innerHTML = `<span class="dot warn"></span> GPS hatası: ${escapeHtml(err.message)}`; },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
      navigator.wakeLock?.request('screen').then((l) => (wakeLock = l)).catch(() => {});
    }
    function stopGps() {
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      wakeLock?.release(); wakeLock = null;
      $('gps').innerHTML = '<span class="dot"></span> GPS kapalı';
    }

    document.querySelectorAll('[data-type]').forEach((b) => b.onclick = async () => {
      try { render(await api('POST', `/api/driver/${token}/trip`, { type: b.dataset.type })); }
      catch (e) { toast(e.message); }
    });
    $('endBtn').onclick = async () => {
      if (!confirm('Tur bitirilsin mi?')) return;
      render(await api('DELETE', `/api/driver/${token}/trip`));
    };
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && watchId != null) navigator.wakeLock?.request('screen').then((l) => (wakeLock = l)).catch(() => {});
    });
    api('GET', `/api/driver/${token}`).then(render).catch((e) => { $('title').textContent = e.message; });
    setInterval(() => api('GET', `/api/driver/${token}`).then(render).catch(() => {}), 15000);
  </script>
</body>
</html>
