<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5a300">
  <title>Şoför</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 12px 12px 40px; }
    .actions { display: grid; gap: 10px; margin: 12px 0; }
    .actions button { padding: 18px; font-size: 1.1rem; }
    .gps { margin: 8px 0; }
    .alarm { background: var(--danger); color: #fff; border-radius: var(--radius); padding: 14px; font-weight: 700; margin: 10px 0; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: .75; } }
    .riders { list-style: none; padding: 0; margin: 0; }
    .riders li { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .riders li:last-child { border-bottom: 0; }
    .riders .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .riders .name { font-size: 1.05rem; font-weight: 600; }
    .riders .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .riders .btns button { padding: 14px 8px; font-size: 1rem; }
    .riders li.off { opacity: .55; }
    .b-ok { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: 600; }
    .b-no { color: var(--danger); border-color: var(--danger); font-weight: 600; }
    .status-ok { color: var(--ok); font-weight: 600; }
    .status-no { color: var(--danger); font-weight: 600; }
    .undo { font-size: .85rem; color: var(--muted); background: none; border: 0; padding: 4px 0; text-decoration: underline; }
    .big-action { width: 100%; padding: 16px; font-size: 1.05rem; margin: 6px 0 12px; }
  </style>
</head>
<body>
  <h2 id="title">Şoför ekranı</h2>
  <div class="card gps small" id="gps"><span class="dot"></span> GPS kapalı</div>
  <div id="alarm"></div>

  <div class="actions" id="startBtns" hidden>
    <button class="primary" data-type="morning">🌅 Sabah turunu başlat (evlerden okula)</button>
    <button class="primary" data-type="afternoon">🌇 Akşam turunu başlat (okuldan evlere)</button>
  </div>

  <div id="tripBox" hidden>
    <div class="card">
      <h3 id="tripTitle"></h3>
      <button class="big-action primary" id="bulkBtn" hidden></button>
      <ul class="riders" id="riders"></ul>
    </div>
    <div class="actions">
      <button class="danger" id="endBtn">⏹ Turu bitir</button>
    </div>
  </div>

  <p class="muted small">Tur boyunca bu sayfayı açık tutun. Konumunuz yalnızca tur sırasında velilerle paylaşılır.</p>

  <script src="/static/common.js"></script>
  <script src="/static/driver.js"></script>
</body>
</html>
