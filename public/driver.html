<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F3A63">
  <title>Şoför · Servis Takip</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { max-width: 560px; margin: 0 auto; padding: 0 max(14px, env(safe-area-inset-right)) 40px max(14px, env(safe-area-inset-left)); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .band { margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))) 4px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-left)) 18px;
      background: linear-gradient(160deg, #2C5490 0%, #1F3A63 100%); color: #fff; border-radius: 0 0 24px 24px; }
    .band .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .band h1 { font-size: 1.45rem; font-weight: 800; margin: 0; }
    .band .who { opacity: .8; font-size: .88rem; }
    .gps { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; background: rgba(255,255,255,.14); padding: 6px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700; }
    .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .counts div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px; }
    .counts b { display: block; font-family: var(--f-display); font-size: 1.4rem; line-height: 1.1; }
    .counts span { font-size: .72rem; opacity: .8; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

    .start { display: grid; gap: 12px; }
    .start button { justify-content: flex-start; text-align: left; padding: 18px; border: 0; border-radius: 18px; gap: 14px; font-size: 1.05rem; box-shadow: var(--shadow); }
    .start button small { display: block; font-weight: 600; opacity: .8; font-size: .82rem; }
    .start .m { background: linear-gradient(150deg, #FFD54A, #F2B705); color: #1C1600; }
    .start .a { background: linear-gradient(150deg, #8A6BE0, #5B3CB8); color: #fff; }
    .start .e { font-size: 2rem; }

    .alarm { background: var(--danger); color: #fff; border-radius: var(--radius); padding: 14px; font-weight: 800; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: .78; } }

    .next { background: var(--primary); border: 0; color: var(--primary-ink); box-shadow: var(--shadow); }
    .next .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; opacity: .75; }
    .next .nm { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; line-height: 1.15; }
    .next .eta { font-family: var(--f-mono); font-weight: 700; font-size: 1.6rem; }
    .next .ad { font-size: .9rem; opacity: .85; }

    .riders { list-style: none; padding: 0; margin: 0; }
    .riders li { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .riders li:last-child { border-bottom: 0; }
    .riders .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .riders .name { font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .riders .no { width: 24px; height: 24px; border-radius: 50%; background: var(--navy-soft); color: var(--navy-2); font-size: .74rem; font-weight: 800; display: grid; place-items: center; flex: none; }
    .riders .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .riders .btns button { padding: 15px 8px; font-size: 1.02rem; border-radius: 14px; font-weight: 800; }
    .riders li.off { opacity: .55; }
    .b-ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .b-no { background: var(--card); color: var(--danger); border: 2px solid var(--danger); }
    .undo { font-size: .8rem; color: var(--muted); background: none; border: 0; padding: 4px 2px; text-decoration: underline; font-weight: 600; }
    .big-action { width: 100%; padding: 17px; font-size: 1.05rem; border-radius: 16px; }
    .end { width: 100%; padding: 15px; border-radius: 16px; color: var(--danger); border: 2px solid var(--danger); background: var(--card); font-weight: 800; }
    .hint { text-align: center; }
  </style>
</head>
<body>
  <div class="stack">
    <div class="band">
      <div class="row">
        <div><h1 id="title">Şoför ekranı</h1><div class="who" id="who"></div></div>
        <span id="plateBox"></span>
      </div>
      <div class="gps" id="gps"><span class="dot"></span> GPS kapalı</div>
      <div class="counts" id="counts" hidden></div>
    </div>

    <div id="alarm"></div>

    <div class="start" id="startBtns" hidden>
      <button class="m" data-type="morning"><span class="e">🌅</span><span>Sabah turunu başlat<small>Evlerden okula</small></span></button>
      <button class="a" data-type="afternoon"><span class="e">🌇</span><span>Akşam turunu başlat<small>Okuldan evlere</small></span></button>
    </div>

    <div class="stack" id="tripBox" hidden>
      <div class="card next" id="nextCard" hidden></div>
      <button class="big-action primary" id="bulkBtn" hidden></button>
      <div class="card">
        <div class="section-t" id="tripTitle"></div>
        <ul class="riders" id="riders"></ul>
      </div>
      <button class="end" id="endBtn">⏹ Turu bitir</button>
    </div>

    <p class="muted small hint">Tur boyunca bu sayfayı açık tutun. Konumunuz yalnızca tur sırasında velilerle paylaşılır.</p>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/driver.js"></script>
</body>
</html>
